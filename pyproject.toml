[project]
name = "blz-desynced-toolkit"
version = "0.1.0"
description = "Compiler/decompiler and lupa-backed runtime for Desynced behavior .dcs files"
authors = [
    { name = "John Bridgman", email = "johnfbiii@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "lupa>=2.8",
]

[project.scripts]
desynced-bsf = "blz.desynced_toolkit.bsf.__main__:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blz.desynced_toolkit"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # long prose-style comments/docstrings are the house style here

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "lupa.*"
ignore_missing_imports = true
